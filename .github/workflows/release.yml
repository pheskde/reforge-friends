name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version im Tag und in der TOC muss uebereinstimmen
        run: |
          toc=$(ls */*.toc | head -n1)
          version=$(grep -m1 '^## Version:' "$toc" | awk '{print $3}' | tr -d '\r')
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} passt nicht zu ## Version: $version in $toc" >&2
            exit 1
          fi
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
